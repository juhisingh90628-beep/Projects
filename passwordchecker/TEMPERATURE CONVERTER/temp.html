<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temperature converter</title>
    <link rel="stylesheet"href='temp.css'>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                temperature Converter
            </h1>
        </div>
        <div class="input1">
            <label for="input1">
                Enter  temperature in Celsious
            </label>
            <input type="text" id="calcius"placeholder='enter your temperature'>
        </div>
        <div class="input2">
            <label for="input2">
                Enter  temperature Kelvin
            </label>
            <input type="text" id="kelvin"placeholder='enter your kelvin'>
        </div>
        <div class="input3">
            <label for="input3">
                Enter  temperature in Farenheit:
            </label>
            <input type="text" id="fahrenheit"placeholder='enter your Farenhiet'>
        </div>
    </div>
    <script src="temp.js"></script>
</body>
</html>
