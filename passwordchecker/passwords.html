<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
  <link rel="stylesheet" href="passwords.css">
</head>
<body>
    
    <div class="container-password">
       <div class="header">
        <h2>Password Generator</h2>
       </div>
    <div class="display">
        <input type="text"id='pass-input'placeholder='password'disabled>
        <button id="copy">copy</button>
    </div>
    <div class="setting">
       <input type="number"id='length-number'value='10'>
 
    </div>
    <div class="settings">
        <label class="length-label">Uppercase</label>
        <input type="checkbox"id='uppercase'checked>
    </div>
     <div class="settings">
         <label class="lower-label">Lowercase</label>
        <input type="checkbox"id='lowercase'checked >
     </div>
      <div class="settings">
         <label class="number-label">Numbers</label>
        <input type="checkbox"id='number' checked>
      </div>
       <!-- <div class="settings">
         <label class="numbers-label">Numbers</label>
        <input type="checkbox"id='number'>
       </div> -->
        <div class="settings">
             <label class="symbol-label">Symbols</label>
        <input type="checkbox"id='symbols' checked>
        <div class="generate-btn">
            <button id="generate" >
               Genrator
            </button>
        </div>
        </div>
       

    </div>
    <script src="password.js"></script>

</body>
</html>
